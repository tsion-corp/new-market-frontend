name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-flow:
    name: branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: dev to staging to main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request; nothing to check."
            exit 0
          fi
          if [ "$BASE" = "staging" ] || [ "$BASE" = "main" ]; then
            if [ "$HEAD_REPO" != "$REPO" ]; then
              echo "Pull requests into $BASE must come from this repository, not a fork."
              exit 1
            fi
          fi
          case "$BASE" in
            main)
              [ "$HEAD" = "staging" ] || { echo "main only accepts pull requests from staging, not $HEAD."; exit 1; } ;;
            staging)
              [ "$HEAD" = "dev" ] || { echo "staging only accepts pull requests from dev, not $HEAD."; exit 1; } ;;
            dev)
              if [ "$HEAD" = "staging" ] || [ "$HEAD" = "main" ]; then
                echo "dev does not take pull requests from $HEAD. Changes flow dev to staging to main."
                exit 1
              fi ;;
          esac
          echo "$HEAD into $BASE follows the branch flow."

  checks:
    name: format, lint, comments, typecheck, knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm comments:check
      - run: pnpm typecheck
      - run: pnpm knip

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: cloudflare build and worker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build:cloudflare
      - run: pnpm smoke:worker
        env:
          WRANGLER_SEND_METRICS: "false"

  lighthouse:
    name: lighthouse (mobile, 98+)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lighthouse
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --redact --no-banner --exit-code 1 .

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [branch-flow, checks, tests, build, lighthouse, secrets]
    if: always()
    steps:
      - name: Every gate passed
        run: |
          echo "branch-flow=${{ needs.branch-flow.result }} checks=${{ needs.checks.result }} tests=${{ needs.tests.result }} build=${{ needs.build.result }} lighthouse=${{ needs.lighthouse.result }} secrets=${{ needs.secrets.result }}"
          test "${{ needs.branch-flow.result }}" = "success"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.lighthouse.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"

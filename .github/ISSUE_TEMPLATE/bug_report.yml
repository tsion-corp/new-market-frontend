name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include error messages and screenshots.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Pixel 8
    validations:
      required: true
  - type: dropdown
    id: environment-name
    attributes:
      label: Environment
      options: [production, staging, local]
    validations:
      required: true
